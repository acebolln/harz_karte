<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Harz-Highlights · Interaktive Reisekarte</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Schriften -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  /* ----------  Design-Tokens  ---------- */
  :root{
    --bg:#f5f3ec;
    --panel:#ffffff;
    --ink:#1f261d;
    --ink-soft:#5d6557;
    --ink-mute:#8b9183;
    --line:#e6e3d8;
    --forest-900:#192f22;
    --forest-700:#28503a;
    --forest-500:#3a6f4d;
    --accent:#c8602f;

    --cat-natur:#2f8f5b;
    --cat-hoehle:#b07d3c;
    --cat-kultur:#4a6fa5;
    --cat-erlebnis:#d8602f;

    --radius:14px;
    --shadow-sm:0 1px 2px rgba(25,40,30,.06),0 2px 6px rgba(25,40,30,.06);
    --shadow-md:0 6px 22px rgba(25,40,30,.13);
    --sidebar-w:386px;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Hanken Grotesk',system-ui,sans-serif;
    color:var(--ink);
    background:var(--bg);
    display:flex;flex-direction:column;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px;}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

  /* ----------  Kopfzeile  ---------- */
  header{
    flex-shrink:0;
    background:linear-gradient(135deg,var(--forest-900),var(--forest-700));
    color:#f4f1e6;
    padding:14px 20px;
    box-shadow:var(--shadow-md);
    z-index:30;
  }
  .header-inner{max-width:1500px;margin:0 auto;display:flex;align-items:center;gap:14px;}
  .crest{
    width:42px;height:42px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.1);border-radius:11px;
    border:1px solid rgba(255,255,255,.16);
  }
  .crest svg{width:22px;height:22px;}
  .header-text h1{
    margin:0;font-family:'Fraunces',serif;font-weight:600;
    font-size:clamp(1.05rem,2.4vw,1.5rem);letter-spacing:-.01em;line-height:1.1;
  }
  .header-text p{margin:2px 0 0;font-size:.78rem;color:#aebfa6;letter-spacing:.03em;}
  .header-badge{
    margin-left:auto;display:flex;align-items:center;gap:7px;
    font-size:.74rem;color:#cdd9c6;background:rgba(255,255,255,.07);
    padding:7px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.12);
  }
  .header-badge b{font-weight:700;color:#fff;}
  @media(max-width:560px){.header-badge{display:none;}}

  /* ----------  Mobile Umschalter  ---------- */
  .segmented{
    display:none;
    flex-shrink:0;
    background:var(--panel);
    padding:8px 12px;
    border-bottom:1px solid var(--line);
    gap:6px;
    z-index:20;
  }
  .segmented button{
    flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
    padding:9px;border-radius:10px;font-weight:600;font-size:.86rem;
    color:var(--ink-soft);transition:.15s;
  }
  .segmented button svg{width:16px;height:16px;}
  .segmented button[aria-selected="true"]{
    background:var(--forest-700);color:#fff;box-shadow:var(--shadow-sm);
  }

  /* ----------  Arbeitsbereich  ---------- */
  .workspace{flex:1;display:flex;min-height:0;}

  /* ----------  Seitenleiste  ---------- */
  #panel-list{
    width:var(--sidebar-w);flex-shrink:0;
    background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;
    z-index:10;
  }
  .list-controls{padding:15px 16px 12px;border-bottom:1px solid var(--line);}

  /* Suchfeld */
  .search{position:relative;}
  .search svg{
    position:absolute;left:13px;top:50%;transform:translateY(-50%);
    width:17px;height:17px;color:var(--ink-mute);pointer-events:none;
  }
  .search input{
    width:100%;padding:11px 38px 11px 38px;
    font-size:.92rem;font-family:inherit;color:var(--ink);
    background:var(--bg);border:1.5px solid var(--line);border-radius:11px;
    transition:.15s;
  }
  .search input::placeholder{color:var(--ink-mute);}
  .search input:focus{border-color:var(--forest-500);background:#fff;outline:none;}
  .search-clear{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:24px;height:24px;border-radius:50%;
    display:none;align-items:center;justify-content:center;
    color:var(--ink-soft);background:var(--line);
  }
  .search-clear.show{display:flex;}
  .search-clear:hover{background:#d8d4c6;}

  /* Kategorie-Filter */
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 11px;border-radius:999px;
    font-size:.78rem;font-weight:600;color:var(--ink-soft);
    background:var(--bg);border:1.5px solid var(--line);
    transition:.14s;
  }
  .chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink-mute));}
  .chip .cnt{font-weight:700;opacity:.55;font-variant-numeric:tabular-nums;}
  .chip:hover{border-color:var(--ink-mute);}
  .chip[aria-pressed="true"]{
    color:#fff;border-color:transparent;
    background:var(--c,var(--forest-700));
  }
  .chip[aria-pressed="true"] .dot{background:rgba(255,255,255,.85);}
  .chip[aria-pressed="true"] .cnt{opacity:.8;}

  /* Statuszeile */
  .list-status{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:11px;font-size:.78rem;color:var(--ink-mute);
  }
  .list-status .count{font-weight:600;color:var(--ink-soft);}
  .sort-toggle{
    display:none;align-items:center;gap:7px;
    font-size:.76rem;font-weight:600;color:var(--ink-soft);cursor:pointer;
  }
  .sort-toggle.show{display:flex;}
  .switch{
    width:34px;height:19px;border-radius:999px;background:var(--line);
    position:relative;transition:.16s;flex-shrink:0;
  }
  .switch::after{
    content:"";position:absolute;top:2px;left:2px;
    width:15px;height:15px;border-radius:50%;background:#fff;
    box-shadow:var(--shadow-sm);transition:.16s;
  }
  .sort-toggle input{position:absolute;opacity:0;}
  .sort-toggle input:checked + .switch{background:var(--forest-500);}
  .sort-toggle input:checked + .switch::after{transform:translateX(15px);}

  /* Liste */
  #poi-list{flex:1;overflow-y:auto;padding:8px;list-style:none;margin:0;
    scroll-padding-top:8px;}
  #poi-list li{margin-bottom:6px;}
  .poi-card{
    width:100%;text-align:left;
    display:flex;gap:11px;align-items:flex-start;
    padding:11px;border-radius:var(--radius);
    border:1.5px solid transparent;
    transition:background .14s,border-color .14s,transform .1s;
    animation:rise .4s both;
  }
  .poi-card:hover{background:var(--bg);}
  .poi-card:active{transform:scale(.99);}
  .poi-card[aria-pressed="true"]{
    background:color-mix(in srgb,var(--c) 9%,#fff);
    border-color:color-mix(in srgb,var(--c) 35%,transparent);
  }
  .poi-num{
    flex-shrink:0;width:30px;height:30px;border-radius:9px;
    background:var(--c,var(--forest-700));color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:.84rem;font-variant-numeric:tabular-nums;
    box-shadow:var(--shadow-sm);
  }
  .poi-body{min-width:0;flex:1;}
  .poi-title{
    font-weight:600;font-size:.93rem;color:var(--ink);
    line-height:1.25;margin-bottom:3px;
  }
  .poi-meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px;margin-bottom:4px;}
  .poi-tag{
    display:inline-flex;align-items:center;gap:4px;
    font-size:.68rem;font-weight:600;color:var(--ink-soft);
  }
  .poi-tag .dot{width:7px;height:7px;border-radius:50%;background:var(--c);}
  .poi-region{
    font-size:.68rem;font-weight:600;color:var(--ink-mute);
    padding:2px 7px;background:var(--bg);border-radius:999px;
  }
  .poi-dist{
    font-size:.68rem;font-weight:700;color:var(--accent);
    font-variant-numeric:tabular-nums;
  }
  .poi-desc{
    font-size:.78rem;color:var(--ink-soft);line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  /* Leerzustand */
  .empty{
    display:none;flex-direction:column;align-items:center;text-align:center;
    padding:48px 24px;color:var(--ink-mute);
  }
  .empty.show{display:flex;}
  .empty svg{width:38px;height:38px;margin-bottom:12px;opacity:.5;}
  .empty p{margin:0 0 14px;font-size:.88rem;}
  .empty button{
    padding:8px 16px;border-radius:10px;font-weight:600;font-size:.82rem;
    color:#fff;background:var(--forest-700);
  }
  .empty button:hover{background:var(--forest-500);}

  /* ----------  Karte  ---------- */
  #panel-map{flex:1;position:relative;min-width:0;}
  #map{position:absolute;inset:0;background:#dfe4dd;}

  /* Ladeanzeige */
  .map-loader{
    position:absolute;inset:0;z-index:600;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    background:var(--bg);color:var(--ink-soft);
    transition:opacity .4s;
  }
  .map-loader.hidden{opacity:0;pointer-events:none;}
  .spinner{
    width:30px;height:30px;border-radius:50%;
    border:3px solid var(--line);border-top-color:var(--forest-500);
    animation:spin .8s linear infinite;
  }
  .map-loader span{font-size:.82rem;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Marker-Pins */
  .pin{
    width:30px;height:30px;border-radius:50%;
    background:var(--c);border:3px solid #fff;
    box-shadow:0 3px 9px rgba(20,30,20,.42);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:.76rem;font-variant-numeric:tabular-nums;
    transition:transform .17s ease,box-shadow .17s ease;
  }
  .leaflet-marker-icon:hover .pin{transform:scale(1.16);}
  .pin.is-active{
    transform:scale(1.32);
    box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 32%,transparent),
               0 6px 16px rgba(20,30,20,.5);
  }
  .user-dot{
    width:18px;height:18px;border-radius:50%;
    background:#2563eb;border:3px solid #fff;
    box-shadow:0 0 0 0 rgba(37,99,235,.5);
    animation:pulse 2.2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(37,99,235,.45);}
    70%{box-shadow:0 0 0 18px rgba(37,99,235,0);}
    100%{box-shadow:0 0 0 0 rgba(37,99,235,0);}
  }

  /* Karten-Werkzeuge */
  .map-tools{display:flex;flex-direction:column;gap:8px;}
  .map-btn{
    width:42px;height:42px;border-radius:11px;
    background:#fff;box-shadow:var(--shadow-md);
    display:flex;align-items:center;justify-content:center;
    color:var(--forest-700);transition:.13s;
  }
  .map-btn:hover{background:var(--forest-700);color:#fff;}
  .map-btn svg{width:20px;height:20px;}
  .map-btn.busy{opacity:.5;pointer-events:none;}

  /* Toast */
  .toast{
    position:absolute;bottom:20px;left:50%;transform:translate(-50%,20px);
    z-index:700;background:var(--ink);color:#fff;
    padding:10px 16px;border-radius:10px;font-size:.82rem;
    box-shadow:var(--shadow-md);opacity:0;transition:.25s;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  /* ----------  Popup  ---------- */
  .leaflet-popup-content-wrapper{border-radius:14px;box-shadow:var(--shadow-md);padding:2px;}
  .leaflet-popup-content{margin:13px 15px;font-family:'Hanken Grotesk',sans-serif;width:270px!important;}
  .pop-cat{
    display:inline-flex;align-items:center;gap:5px;
    font-size:.67rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:var(--c);margin-bottom:5px;
  }
  .pop-cat .dot{width:8px;height:8px;border-radius:50%;background:var(--c);}
  .pop-title{
    font-family:'Fraunces',serif;font-weight:600;font-size:1.04rem;
    line-height:1.18;color:var(--ink);margin-bottom:6px;
  }
  .pop-desc{font-size:.8rem;line-height:1.5;color:var(--ink-soft);margin-bottom:10px;}
  .pop-mtb{
    background:var(--bg);border-radius:9px;padding:9px 10px;margin-bottom:10px;
    border:1px solid var(--line);
  }
  .pop-mtb-row{
    display:flex;gap:8px;font-size:.76rem;line-height:1.4;margin-bottom:3px;
  }
  .pop-mtb-row b{
    flex-shrink:0;width:34px;color:var(--ink-mute);font-weight:700;
    text-transform:uppercase;font-size:.62rem;letter-spacing:.04em;padding-top:1px;
  }
  .pop-mtb-row span{color:var(--ink);}
  .pop-mtb-detail{
    font-size:.76rem;line-height:1.5;color:var(--ink-soft);
    margin-top:6px;padding-top:6px;border-top:1px solid var(--line);
  }
  .pop-conf{
    display:inline-block;margin-top:7px;
    font-size:.64rem;font-weight:700;letter-spacing:.04em;
    padding:2px 8px;border-radius:999px;
  }
  .conf-high{background:#dff0e2;color:#1f6b3a;}
  .conf-medhigh{background:#eef0d8;color:#6b6312;}
  .conf-med{background:#f3e7d3;color:#8a5a16;}
  .conf-low{background:#f0dcd6;color:#9a432a;}
  .pop-route{
    display:flex;align-items:center;justify-content:center;gap:7px;
    width:100%;padding:9px;border-radius:9px;
    background:var(--forest-700);color:#fff!important;
    font-weight:600;font-size:.81rem;text-decoration:none;transition:.13s;
  }
  .pop-route:hover{background:var(--forest-500);}
  .pop-route svg{width:15px;height:15px;}

  /* ----------  Responsiv  ---------- */
  @media(max-width:820px){
    .segmented{display:flex;}
    .workspace{position:relative;}
    #panel-list,#panel-map{position:absolute;inset:0;width:auto;}
    #panel-list{border-right:none;}
    body[data-view="map"] #panel-list{display:none;}
    body[data-view="list"] #panel-map{display:none;}
    :root{--sidebar-w:100%;}
  }
</style>
</head>
<body data-view="map">

<!-- ================  KOPFZEILE  ================ -->
<header>
  <div class="header-inner">
    <div class="crest" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#dfe9d8" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 20l5-9 4 6 3-4 6 7z"/><circle cx="17" cy="6" r="2.4"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>Highlights im Harz</h1>
      <p>West · Mitte · Süd — interaktive Reisekarte</p>
    </div>
    <div class="header-badge">
      <b id="badge-count">20</b><span>handverlesene Ziele</span>
    </div>
  </div>
</header>

<!-- ================  MOBILE-UMSCHALTER  ================ -->
<div class="segmented" role="tablist" aria-label="Ansicht wechseln">
  <button id="tab-map" role="tab" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/>
    </svg>Karte
  </button>
  <button id="tab-list" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
    </svg>Liste
  </button>
</div>

<!-- ================  ARBEITSBEREICH  ================ -->
<main class="workspace">

  <!-- ----------  Seitenleiste  ---------- -->
  <section id="panel-list" aria-label="Liste der Sehenswürdigkeiten">
    <div class="list-controls">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
        </svg>
        <label class="visually-hidden" for="search-input">Ziele durchsuchen</label>
        <input id="search-input" type="search" placeholder="Ziel oder Stichwort suchen…"
               autocomplete="off" />
        <button class="search-clear" id="search-clear" aria-label="Suche zurücksetzen">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="chips" id="chips" role="group" aria-label="Nach Kategorie filtern"></div>

      <div class="list-status">
        <span class="count" id="result-count"></span>
        <label class="sort-toggle" id="sort-toggle">
          <input type="checkbox" id="sort-check" />
          <span class="switch"></span>Nach Entfernung
        </label>
      </div>
    </div>

    <ul id="poi-list"></ul>

    <div class="empty" id="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6"/>
      </svg>
      <p>Keine Ziele für diese Auswahl.</p>
      <button id="empty-reset">Filter zurücksetzen</button>
    </div>
  </section>

  <!-- ----------  Karte  ---------- -->
  <section id="panel-map" aria-label="Karte">
    <div id="map"></div>
    <div class="map-loader" id="map-loader">
      <div class="spinner"></div><span>Karte wird geladen…</span>
    </div>
    <div class="toast" id="toast"></div>
  </section>

</main>

<script>
/* =====================================================================
   1 · DATEN
   ===================================================================== */
const CATS = {
  natur:    { label:"Natur & Aussicht",  color:"#2f8f5b" },
  hoehle:   { label:"Höhlen",            color:"#b07d3c" },
  kultur:   { label:"Kultur & Bauwerke", color:"#4a6fa5" },
  erlebnis: { label:"Erlebnis & Action", color:"#d8602f" },
  mtb:      { label:"MTB & Trails",      color:"#7a3ea8" }
};

const POIS = [
  { name:"Magische Rhumequelle", lat:51.589656, lng:10.310175, cat:"natur", region:"Südharz",
    desc:"Mystischer Ort bei Rhumspringe. Mit bis zu 5000 Litern pro Sekunde eine der stärksten Karstquellen Deutschlands. Das Wasser schimmert oft türkis." },
  { name:"Rappbodetalsperre & Titan-RT", lat:51.7410, lng:10.8930, cat:"erlebnis", region:"Ostharz",
    desc:"Höchste Staumauer und die drittlängste Hängeseilbrücke (485,5 m) Deutschlands. Extra: GigaSwing in 64m Tiefe oder Aussichtspunkt Rotestein." },
  { name:"Stabkirche Hahnenklee", lat:51.8569, lng:10.3400, cat:"kultur", region:"Westharz",
    desc:"Die Gustav-Adolf-Stabkirche von 1907. Typisch norwegische Bauweise im Goslarer Stadtteil Hahnenklee. Duftet innen herrlich nach Holz." },
  { name:"Baumwipfelpfad Harz", lat:51.8700, lng:10.5632, cat:"erlebnis", region:"Westharz",
    desc:"Ein 1000 Meter langer Pfad in Bad Harzburg in bis zu 30 Metern Höhe. Bietet 18 Plattformen und schöne Natur-Ausblicke." },
  { name:"Wolfswarte auf dem Bruchberg", lat:51.7836, lng:10.5000, cat:"natur", region:"Westharz",
    desc:"Die waldlose Kuppe aus Quarzit auf dem zweithöchsten Berg Niedersachsens (Bruchberg). Bietet bei gutem Wetter atemberaubende Ausblicke." },
  { name:"Das Kleinste Haus in Wernigerode", lat:51.8329, lng:10.7873, cat:"kultur", region:"Ostharz",
    desc:"Nur 2,95m breit und 4,20m hoch, mit einer 1,70m hohen Tür. Zwischen Baulücken errichtet, diente es einst als Wohnung für bis zu 11 Personen." },
  { name:"Burg Falkenstein", lat:51.6816, lng:11.2650, cat:"kultur", region:"Ostharz",
    desc:"Im 12. Jahrhundert erbaut, erhebt sich die Burg majestätisch über der Selke. Gilt als am besten erhaltene Burg im Harz mit tollem Panorama." },
  { name:"Einhornhöhle", lat:51.6350, lng:10.4042, cat:"hoehle", region:"Südharz",

/* =====================================================================

).addTo(map);

const hideLoader = () => loader.classList.add("hidden");

/* =====================================================================
   4 · MARKER
   ===================================================================== */
const markers = {};

POIS.forEach((p,i) => {
  const color = CATS[p.cat].color;
  const icon = L.divIcon({
    className:"",
    html:`<div class="pin" style="--c:${color}">${i+1}</div>`,
    iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-15]
  });
  const m = L.marker([p.lat,p.lng],{ icon, title:p.name, riseOnHover:true });
  m.bindPopup(() => buildPopup(i), { closeButton:true });
  m.on("click", () => selectPoi(i));
  m._visible = false;
  markers[i] = m;
});

function buildPopup(i){
  const p = POIS[i], c = CATS[p.cat];
  const gmaps = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;

  let mtbBlock = "";
  if(p.mtb){
    const conf = p.confidence
      ? `<span class="pop-conf conf-${p.confidence.replace(/[^A-Z]/g,'').toLowerCase()}">Konfidenz ${p.confidence}</span>`
      : "";
    mtbBlock = `
      <div class="pop-mtb">
        <div class="pop-mtb-row"><b>Typ</b><span>${p.mtb.typ}</span></div>
        <div class="pop-mtb-row"><b>Lift</b><span>${p.mtb.lift}</span></div>
        <div class="pop-mtb-detail">${p.mtb.detail}</div>
        ${conf}
      </div>`;
  }

  return `
    <div class="pop-cat" style="--c:${c.color}"><span class="dot"></span>${c.label} · ${p.region}</div>
    <div class="pop-title">${p.name}</div>
    <div class="pop-desc">${p.desc}</div>
    ${mtbBlock}
    <a class="pop-route" href="${gmaps}" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11l19-8-8 19-3-8-8-3z"/></svg>
      Route planen
    </a>`;
}

/* =====================================================================
   5 · HILFSFUNKTIONEN
   ===================================================================== */
const isMobile = () => window.matchMedia("(max-width:820px)").matches;

// Entfernung (Haversine) in Kilometern
function distanceKm(a,b){
  const R=6371, rad=x=>x*Math.PI/180;
  const dLat=rad(b.lat-a.lat), dLng=rad(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
  return R*2*Math.asin(Math.sqrt(s));
}
const fmtDist = km => km<1 ? `${Math.round(km*1000)} m` : `${km.toFixed(1)} km`;

let toastTimer;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"), 3200);
}

/* =====================================================================
   6 · FILTER & RENDERING
   ===================================================================== */
function getFiltered(){
  const q = state.search.trim().toLowerCase();
  let rows = POIS.map((p,i)=>({p,i}))
    .filter(({p}) => {
      const okCat  = state.category==="all" || p.cat===state.category;
      const okText = !q || p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q);
      return okCat && okText;
    });
  if(state.sortByDist && state.userLatLng){
    rows.sort((a,b) =>
      distanceKm(state.userLatLng,a.p) - distanceKm(state.userLatLng,b.p));
  }
  return rows;
}

const listEl   = document.getElementById("poi-list");
const emptyEl  = document.getElementById("empty-state");
const countEl  = document.getElementById("result-count");

function render(){
  const rows = getFiltered();

  /* --- Liste --- */
  listEl.innerHTML = "";
  rows.forEach(({p,i}, order) => {
    const c = CATS[p.cat];
    const li = document.createElement("li");
    const dist = state.userLatLng ? distanceKm(state.userLatLng,p) : null;

    const btn = document.createElement("button");
    btn.className = "poi-card";
    btn.style.setProperty("--c", c.color);
    btn.dataset.idx = i;
    btn.setAttribute("aria-pressed", state.activeIndex===i ? "true":"false");
    btn.style.animationDelay = Math.min(order*28,320)+"ms";
    btn.innerHTML = `
      <span class="poi-num">${i+1}</span>
      <span class="poi-body">
        <span class="poi-title">${p.name}</span>
        <span class="poi-meta">
          <span class="poi-tag"><span class="dot"></span>${c.label}</span>
          <span class="poi-region">${p.region}</span>
          ${dist!=null ? `<span class="poi-dist">${fmtDist(dist)}</span>` : ""}
        </span>
        <span class="poi-desc">${p.desc}</span>
      </span>`;
    btn.addEventListener("click", () => selectPoi(i));
    li.appendChild(btn);
    listEl.appendChild(li);
  });

  emptyEl.classList.toggle("show", rows.length===0);

  /* --- Statuszeile --- */
  const total = POIS.length;
  countEl.textContent = rows.length===total
    ? `${total} Ziele`
    : `${rows.length} von ${total} Zielen`;

  /* --- Marker ein-/ausblenden --- */
  const visible = new Set(rows.map(r=>r.i));
  POIS.forEach((p,i) => {
    const m = markers[i];
    if(visible.has(i) && !m._visible){
      m.addTo(map); m._visible=true; applyMarkerActive(i);
    } else if(!visible.has(i) && m._visible){
      map.removeLayer(m); m._visible=false;
    }
  });
}

/* =====================================================================
   7 · AUSWAHL / SYNCHRONISATION
   ===================================================================== */
function applyMarkerActive(i){
  const m = markers[i];
  if(!m || !m._visible) return;
  const el = m.getElement();
  if(!el) return;
  const pin = el.querySelector(".pin");
  const on = state.activeIndex===i;
  if(pin) pin.classList.toggle("is-active", on);
  m.setZIndexOffset(on ? 1000 : 0);
}

function updateActiveStates(){
  listEl.querySelectorAll(".poi-card").forEach(card => {
    card.setAttribute("aria-pressed",
      Number(card.dataset.idx)===state.activeIndex ? "true":"false");
  });
  POIS.forEach((_,i)=>applyMarkerActive(i));
}

function selectPoi(i){
  state.activeIndex = i;
  updateActiveStates();

  const p = POIS[i];
  const flyAndOpen = () => {
    map.flyTo([p.lat,p.lng], 13, { duration:1.1 });
    const m = markers[i];
    if(m && m._visible) setTimeout(()=>m.openPopup(), 680);
  };

  if(isMobile() && document.body.dataset.view!=="map"){
    setView("map");
    setTimeout(()=>{ map.invalidateSize(); flyAndOpen(); }, 280);
  } else {
    flyAndOpen();
  }

  const card = listEl.querySelector(`[data-idx="${i}"]`);
  if(card) card.scrollIntoView({ block:"nearest", behavior:"smooth" });
}

function clearActive(){
  state.activeIndex = null;
  updateActiveStates();
}
map.on("click", clearActive);

/* =====================================================================
   8 · KATEGORIE-FILTER (Chips)
   ===================================================================== */
const chipsEl = document.getElementById("chips");

function buildChips(){
  const counts = {};
  POIS.forEach(p => counts[p.cat]=(counts[p.cat]||0)+1);

  const entries = [["all","Alle", null, POIS.length],
    ...Object.entries(CATS).map(([k,v]) => [k, v.label, v.color, counts[k]||0])];

  chipsEl.innerHTML = "";
  entries.forEach(([key,label,color,cnt]) => {
    const b = document.createElement("button");
    b.className = "chip";
    if(color) b.style.setProperty("--c", color);
    b.dataset.cat = key;
    b.setAttribute("aria-pressed", state.category===key ? "true":"false");
    b.innerHTML = `${color?'<span class="dot"></span>':''}${label}<span class="cnt">${cnt}</span>`;
    b.addEventListener("click", () => {
      state.category = key;
      chipsEl.querySelectorAll(".chip").forEach(c =>
        c.setAttribute("aria-pressed", c.dataset.cat===key ? "true":"false"));
      render();
    });
    chipsEl.appendChild(b);
  });
}

/* =====================================================================
   9 · SUCHE
   ===================================================================== */
const searchInput = document.getElementById("search-input");
const searchClear = document.getElementById("search-clear");

searchInput.addEventListener("input", e => {
  state.search = e.target.value;
  searchClear.classList.toggle("show", state.search.length>0);
  render();
});
searchClear.addEventListener("click", () => {
  searchInput.value=""; state.search="";
  searchClear.classList.remove("show");
  render(); searchInput.focus();
});

document.getElementById("empty-reset").addEventListener("click", () => {
  state.search=""; state.category="all";
  searchInput.value=""; searchClear.classList.remove("show");
  buildChips(); render();
});

  const pts = POIS.filter((_,i)=>markers[i]._visible).map(p=>[p.lat,p.lng]);
  if(pts.length>1) map.flyToBounds(L.latLngBounds(pts), { padding:[60,60], duration:1 });
  else if(pts.length===1) map.flyTo(pts[0], 12, { duration:1 });
});

// Standort bestimmen
let userMarker = null;
document.getElementById("btn-locate").addEventListener("click", () => {
  const btn = document.getElementById("btn-locate");
  if(!navigator.geolocation){ toast("Standort wird vom Browser nicht unterstützt."); return; }
  btn.classList.add("busy");
  navigator.geolocation.getCurrentPosition(
    pos => {
      btn.classList.remove("busy");
      const ll = { lat:pos.coords.latitude, lng:pos.coords.longitude };
      state.userLatLng = ll;

      if(userMarker) map.removeLayer(userMarker);
      userMarker = L.marker([ll.lat,ll.lng], {
        icon:L.divIcon({ className:"", html:'<div class="user-dot"></div>',
          iconSize:[18,18], iconAnchor:[9,9] }),
        zIndexOffset:2000, interactive:false
      }).addTo(map);

      document.getElementById("sort-toggle").classList.add("show");
      map.flyTo([ll.lat,ll.lng], 10, { duration:1 });
      render();
      toast("Standort gefunden — Entfernungen werden angezeigt.");
    },
    () => { btn.classList.remove("busy"); toast("Standort konnte nicht ermittelt werden."); },
    { enableHighAccuracy:true, timeout:8000 }
  );
});

/* =====================================================================
   12 · MOBILE-ANSICHT (Karte / Liste)
   ===================================================================== */
const tabMap  = document.getElementById("tab-map");
const tabList = document.getElementById("tab-list");

function setView(v){
  document.body.dataset.view = v;
  tabMap.setAttribute("aria-selected",  v==="map" ?"true":"false");
  tabList.setAttribute("aria-selected", v==="list"?"true":"false");
  if(v==="map") setTimeout(()=>map.invalidateSize(), 240);
}
tabMap.addEventListener("click",  ()=>setView("map"));
tabList.addEventListener("click", ()=>setView("list"));

/* =====================================================================
   13 · START
   ===================================================================== */
document.getElementById("badge-count").textContent = POIS.length;
buildChips();
render();
setTimeout(()=>map.invalidateSize(), 150);
window.addEventListener("resize", ()=>map.invalidateSize());
</script>
